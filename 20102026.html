<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Món quà 20/10 tặng Mẹ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background-color:#333;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden}
.banner-container{position:relative;width:100%;max-width:1000px;aspect-ratio:1000/563;overflow:hidden;border-radius:10px;background-color:transparent;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .5s ease;isolation:isolate}
.bg-image{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;object-fit:cover;z-index:1;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.3);transition:opacity 1s ease;pointer-events:none}
.video-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;object-fit:cover;z-index:1;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.3);display:none;opacity:0;transition:opacity 1s ease;pointer-events:none}
#familyVideoBg {width: 115% !important;height: 125% !important;}
#flowerVideoBg{z-index:60!important;transition:opacity 3s ease!important;opacity:0}
.flower-logo-cover{position:absolute;top:72%;left:72%;width:42%;z-index:61;pointer-events:none;display:none;opacity:0;transition:opacity 3s ease!important}
.event-cover-img{position:absolute;top:63.5%;left:54%;transform:translate(-50%,-50%);width:16%;z-index:2;pointer-events:none;display:none;opacity:0;transition:opacity 1s ease}
.coin-stage{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;display:none;pointer-events:none;overflow:hidden}
.coin-half{position:absolute;top:0;height:100%;width:50%;overflow:hidden;transition:transform 1.5s ease-in-out}
.coin-left{left:0;transform:translateX(-100%)}
.coin-right{right:0;transform:translateX(100%)}
.coin-half img{position:absolute;top:0;height:100%;width:100vw;max-width:1000px;object-fit:cover}
.coin-left img{left:0;clip-path:inset(0 50% 0 0)}
.coin-right img{right:0;clip-path:inset(0 0 0 50%)}
.coin-stage.active .coin-left{transform:translateX(0)}
.coin-stage.active .coin-right{transform:translateX(0)}
.coin-overlay-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;z-index:110;display:none;pointer-events:none;background-color:#fff;overflow:hidden;opacity:0}
.coin-image{position:absolute;top:50%;left:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%)}
.coin-overlay-wrapper.rotating{display:block;animation:spinCoin 2s linear forwards}
@keyframes spinCoin{0%{transform:rotate(0deg);opacity:0}5%{opacity:1}100%{transform:rotate(360deg);opacity:1}}
.title-text{position:absolute;top:10%;left:50%;transform:translate(-50%,-50%);z-index:50;font-size:clamp(16px,2.8vw,28px);font-weight:900;width:90%;text-align:center;white-space:nowrap;background:linear-gradient(90deg,#4A90E2 0%,#E91E63 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 2px rgba(255,255,255,.8));opacity:0;transition:opacity 1s ease;}
.title-text.show{animation:whipIn 1.5s ease-out forwards,pulse 2s 1.5s infinite ease-in-out}
.title-text.returned{opacity:1;transform:translate(-50%,-50%);animation:pulse 2s infinite ease-in-out}
@keyframes whipIn{0%{opacity:0;transform:translate(-200%,-50%)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1)}}
.images-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;z-index:40;transition:opacity 1s ease;pointer-events:auto}
.item-img{position:absolute;cursor:pointer;opacity:0;transform:translateY(30px);transition:opacity .5s ease, transform .3s ease}
.item-img.returned{opacity:1;transform:translateY(0)}
.item-1{top:12%;left:25%;width:23%}.item-2{top:18%;left:52%;width:30%}.item-3{top:50%;left:26%;width:22%}.item-4{top:50%;left:56%;width:22%}
.item-img.show-img{animation:showImg 1s ease-out forwards}
@keyframes showImg{to{opacity:1;transform:translateY(0)}}
.item-img:hover{transform:scale(1.15) translateY(-5px)!important;filter:drop-shadow(0 15px 15px rgba(216,27,96,.6));z-index:60}
.next-btn{position:absolute;top:78%;left:50%;transform:translateX(-50%) scale(.8);width:120px;z-index:80;cursor:pointer;opacity:0;transition:all .5s ease;animation:floatArrow 2s infinite alternate ease-in-out}
@keyframes floatArrow{0%{transform:translateX(-50%) translateY(0) scale(1)}100%{transform:translateX(-50%) translateY(-10px) scale(1.05)}}
.next-btn.show{opacity:1;transform:translateX(-50%) scale(1)}
.next-btn:hover{transform:translateX(-50%) scale(1.2)!important;filter:drop-shadow(0 10px 15px rgba(0,0,0,.5))}
.wish-wrapper{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;width:100%;height:100%;display:flex;justify-content:center;align-items:center;pointer-events:none;transition:opacity .5s ease}
.wish-text{position:relative;z-index:71;width:90%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(22px,4vw,38px);font-weight:bold;color:#fff;line-height:1.5;text-align:center;text-shadow:0 4px 10px rgba(0,0,0,.8),0 0 20px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.6);opacity:0;transition:opacity .5s ease}
.wish-wrapper.show .wish-text{opacity:1;animation:fadeInText 1.5s ease-out forwards}
@keyframes fadeInText{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.wish-text span{display:inline-block;padding-bottom:20px;animation-fill-mode:both}
.wish-wrapper.show .wish-text span:nth-child(1){animation:waveUpDown 2s ease-in-out infinite alternate;animation-delay:0s}
.wish-wrapper.show .wish-text span:nth-child(2){animation:waveUpDown 2s ease-in-out infinite alternate;animation-delay:.25s}
.wish-wrapper.show .wish-text span:nth-child(3){animation:waveUpDown 2s ease-in-out infinite alternate;animation-delay:.5s}
.wish-wrapper.show .wish-text span:nth-child(4){animation:waveUpDown 2s ease-in-out infinite alternate;animation-delay:.75s}
@keyframes waveUpDown{0%{transform:translateY(0px)}100%{transform:translateY(-15px)}}
.smoke-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;pointer-events:none;display:none;overflow:hidden}
.smoke-layer.active{display:block}
.smoke-circle{position:absolute;background:radial-gradient(circle at 30% 30%,#fff 0%,#FCE4EC 30%,#F8BBD0 70%,rgba(248,187,208,0) 100%);border-radius:50%;opacity:0;animation:explode 5s ease-out forwards;left:36.5%;top:23.5%;transform:translate(-50%,-50%)}
@keyframes explode{0%{transform:scale(0) translate(0,0);opacity:.8}50%{opacity:1}100%{transform:scale(4) translate(var(--x),var(--y));opacity:0}}
.smoke-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,#FCE4EC 30%,#F8BBD0 100%);z-index:199;opacity:0;display:none}
.smoke-overlay.active{display:block;animation:fadeOutSmoke 4s 2s forwards}
@keyframes fadeOutSmoke{0%{opacity:1}100%{opacity:0}}
.petal-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:45;overflow:hidden;display:block}
.petal{position:absolute;background:linear-gradient(135deg,#ffb6c1,#ff69b4);border-radius:15px 0 15px 0;opacity:.8;animation:fall linear forwards;top:-50px}
@keyframes fall{0%{top:-50px;transform:rotate(0deg);opacity:.8}100%{top:110%;transform:rotate(720deg);opacity:0}}
.cloud-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;pointer-events:none;overflow:hidden;display:none}
.cloud-layer.active{display:block}
.cloud-blob{position:absolute;background:radial-gradient(circle at 50% 50%,rgba(255,230,235,0.95) 0%,rgba(248,187,208,0.8) 40%,rgba(248,187,208,0) 80%);border-radius:50%;filter:blur(20px);opacity:0}
.cloud-blob.from-left{left:-30%;animation:cloudMoveLeft 4s ease-in-out forwards}
.cloud-blob.from-right{right:-30%;animation:cloudMoveRight 4s ease-in-out forwards}
@keyframes cloudMoveLeft{0%{transform:translateX(0) scale(0.8);opacity:0}20%{opacity:1}100%{transform:translateX(160vw) scale(1.5);opacity:0}}
@keyframes cloudMoveRight{0%{transform:translateX(0) scale(0.8);opacity:0}20%{opacity:1}100%{transform:translateX(-160vw) scale(1.5);opacity:0}}
.bloom-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:150;pointer-events:none;overflow:hidden;display:none;transition:opacity 3s ease}
.bloom-layer.active{display:block;opacity:1}
.bloom-layer.fade-out{opacity:0}
.bloom-item{position:absolute;opacity:0;transform:scale(0);transform-origin:center center;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3));animation:bloomUp 3s cubic-bezier(0.2,0.8,0.2,1) forwards}
.bloom-item.size-1{font-size:6vw}.bloom-item.size-2{font-size:8vw}.bloom-item.size-3{font-size:10vw}.bloom-item.size-4{font-size:12vw}
@keyframes bloomUp{0%{opacity:0;transform:scale(0) rotate(-20deg)}50%{opacity:1;transform:scale(1.1) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}

.petal-fly-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:90;pointer-events:none;overflow:hidden;display:none}
.petal-fly-layer.active{display:block}
.petal-fly{position:absolute;background:linear-gradient(135deg,#ffb6c1,#ff69b4);border-radius:15px 0 15px 0;opacity:0;animation:flyUpScatter 3s ease-in forwards;}
@keyframes flyUpScatter{0%{transform:translateY(50px) rotate(0deg) scale(0);opacity:0}20%{opacity:1;transform:translateY(0px) rotate(20deg) scale(1.2)}80%{opacity:1}100%{transform:translateY(-100px) rotate(180deg) scale(1);opacity:0}}

.heart-layer {position:absolute;top:0;left:0;width:100%;height:100%;z-index:105;pointer-events:none;overflow:hidden;display:none}
.heart-layer.active {display:block}
.main-heart {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:15vw;opacity:0;animation: heartBeat 1.5s ease-in-out forwards;}
@keyframes heartBeat {
  0% {transform:translate(-50%,-50%) scale(0);opacity:0}
  20% {transform:translate(-50%,-50%) scale(1.2);opacity:1}
  40% {transform:translate(-50%,-50%) scale(1);opacity:1}
  60% {transform:translate(-50%,-50%) scale(1.3);opacity:1}
  80% {transform:translate(-50%,-50%) scale(1);opacity:1}
  100% {transform:translate(-50%,-50%) scale(1.5);opacity:0}
}
.spark-particle {position:absolute;top:50%;left:50%;width:15px;height:15px;background:radial-gradient(circle, #fff 20%, #ffeb3b 60%, transparent 100%);border-radius:50%;opacity:0;animation: sparkFly 2s ease-out forwards;}
@keyframes sparkFly {
  0% {transform:translate(-50%,-50%) scale(1);opacity:1}
  100% {transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);opacity:0}
}

.flash-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 999; pointer-events: none; overflow: hidden; display: none;
}
.flash-layer.active { display: block; }
.flash-circle {
  position: absolute; top: 50%; left: 50%;
  width: 10px; height: 10px;
  background-color: #f8bbd0;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  box-shadow: 0 0 100px 50px #f8bbd0;
  opacity: 0;
  animation: flashExpand 3s ease-in-out forwards;
}
@keyframes flashExpand {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  40% { transform: translate(-50%, -50%) scale(200); opacity: 1; }
  60% { transform: translate(-50%, -50%) scale(200); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(200); opacity: 0; }
}
</style>
</head>
<body>
<div class="banner-container" id="bannerBox">
  <div class="smoke-overlay" id="smokeOverlay"></div><div class="smoke-layer" id="smokeLayer"></div><div class="cloud-layer" id="cloudLayer"></div><div class="bloom-layer" id="bloomLayer"></div>
  
  <div class="petal-fly-layer" id="petalFlyLayer"></div>
  <div class="heart-layer" id="heartLayer"></div>
  <div class="flash-layer" id="flashLayer"></div>

  <div class="coin-stage" id="coinStage"><div class="coin-half coin-left"><img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/coin1.png"></div><div class="coin-half coin-right"><img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/coin1.png"></div></div>
  <div class="coin-overlay-wrapper" id="coinFullOverlay"><img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/coin1.png" class="coin-image"></div>
  
  <img src="https://uploads.onecompiler.io/4572fw7d6/1792836583532/nen.png" alt="" class="bg-image" id="mainBg">
  
  <img src="https://uploads.onecompiler.io/4572fw7d6/457akjfj3/ketbai.png" alt="" class="bg-image" id="ketbaiBg" style="display:none; opacity:0; z-index:1;">
  
  <video loop playsinline class="video-bg" id="videoBg"><source src="https://github.com/nguyenbaole02112000-lab/phunuvid/raw/refs/heads/main/island1.mp4" type="video/mp4"></video>
  <video loop playsinline class="video-bg" id="companyVideoBg"><source src="https://github.com/nguyenbaole02112000-lab/phunuvid/raw/refs/heads/main/hkh-vidbg.mp4" type="video/mp4"></video>
  <video loop playsinline class="video-bg" id="flowerVideoBg"><source src="https://raw.githubusercontent.com/nguyenbaole02112000-lab/phunuvid/main/phunu-vid.mp4" type="video/mp4"></video>
  <video loop playsinline class="video-bg" id="familyVideoBg"><source src="https://github.com/nguyenbaole02112000-lab/phunuvid/raw/refs/heads/main/fml-vid.mp4" type="video/mp4"></video>

  <img src="https://uploads.onecompiler.io/4572fw7d6/1792973157654/hoa-rmbg.png" class="flower-logo-cover" id="flowerLogoCover">
  <img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/screenshot_1792937270.png" class="event-cover-img" id="eventCoverImg">
  <img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/lap.png" id="leafCover" style="position:absolute;bottom:0;right:0;width:17%;height:auto;z-index:2;pointer-events:none;border-bottom-right-radius:15px;transform:translate(1px,1px);display:none;opacity:0;transition:opacity .5s ease">
  <img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/lap1.png" id="companyLeafCover" style="position:absolute;bottom:0;right:0;width:17%;height:auto;z-index:2;pointer-events:none;border-bottom-right-radius:15px;transform:translate(1px,1px);display:none;opacity:0;transition:opacity .5s ease">
  <div class="petal-layer" id="petalLayer"></div>
  
  <!-- THẺ AUDIO ẨN CHO NHẠC NỀN -->
  <audio id="bgMusic" loop></audio>

  <h1 class="title-text show" id="mainTitle">20/10 rồi, mẹ muốn con bù đắp điều gì nào?</h1>
  <div class="images-wrapper" id="imagesWrapper">
    <img src="https://uploads.onecompiler.io/4572fw7d6/4574cwzz7/dulich-rmbg.png" alt="" class="item-img item-1" data-width="22%" onclick="selectItem(this, 'dulich')">
    <img src="https://uploads.onecompiler.io/4572fw7d6/1792836462320/thanhcong-rmbg.png" alt="" class="item-img item-2" data-width="30%" onclick="selectItem(this, 'thanhcong')">
    
    <img src="https://uploads.onecompiler.io/4572fw7d6/1792837077065/bohoa-rmbg.png" alt="" class="item-img item-3" data-width="22%" onclick="selectItem(this, 'hoa')">
    
    <img src="https://uploads.onecompiler.io/4572fw7d6/1792837352689/family-rmbg.png" alt="" class="item-img item-4" data-width="22%" onclick="selectItem(this, 'family')">
  </div>
  <div class="wish-wrapper" id="wishWrapper"><h2 class="wish-text" id="wishTextContent"></h2></div>
  <img src="https://uploads.onecompiler.io/4572fw7d6/45752xe42/chontiep1-rmbg.png" alt="" class="next-btn" id="nextBtn">
</div>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  // ===== LOGIC NHẠC NỀN =====
  const bgMusic = document.getElementById('bgMusic');
  const musicList = [
    'https://github.com/nguyenbaole02112000-lab/phunuvid/raw/refs/heads/main/G%C3%A1nh%20M%E1%BA%B9.mp3',
    'https://github.com/nguyenbaole02112000-lab/phunuvid/raw/refs/heads/main/Nh%E1%BA%ADt%20K%C3%BD%20C%E1%BB%A7a%20M%E1%BA%B9.mp3'
  ];
  
  let allowMusic = true; // Cờ cho phép phát nhạc
  let hasInteracted = false;

  const playMusicFromStart = () => {
    if (!allowMusic) return; 

    // Nếu nhạc đã phát đúng bài này rồi thì không cần reset lại từ đầu
    const randomIndex = Math.floor(Math.random() * musicList.length);
    const chosenSong = musicList[randomIndex];
    
    // Nếu đang phát bài khác hoặc chưa phát thì đổi src và phát
    if (bgMusic.src !== chosenSong || bgMusic.paused) {
        bgMusic.src = chosenSong;
        bgMusic.currentTime = 0; // Bắt đầu từ giây 0
        bgMusic.volume = 0.5;
        
        let playPromise = bgMusic.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("Trình duyệt chặn phát nhạc tự động.");
          });
        }
    }
  };

  // Sự kiện click đầu tiên trên màn hình để phá vỡ rào cản autoplay
  document.body.addEventListener('click', () => {
    if (!hasInteracted) {
      hasInteracted = true;
      // Nếu đang ở Lobby (không xem item), thì phát nhạc
      if (!isTransitioned) {
        playMusicFromStart();
      }
    }
  });

  // Cố gắng phát nhạc ngay khi vừa vào Lobby
  playMusicFromStart();

  // ===================================

  let petalInterval=null;
  const startPetals=()=>{
    if(petalInterval)return;
    const l=document.getElementById('petalLayer');if(!l)return;
    petalInterval=setInterval(()=>{
      for(let j=0;j<3;j++){
        const p=document.createElement('div');p.classList.add('petal');
        const s=Math.random()*10+10;p.style.width=`${s}px`;p.style.height=`${s}px`;p.style.left=`${Math.random()*100}%`;
        const d=Math.random()*4+4;p.style.animationDuration=`${d}s`;l.appendChild(p);setTimeout(()=>{p.remove();},d*1000);
      }
    },300);
  };
  const stopPetals=()=>{
    const l=document.getElementById('petalLayer');if(petalInterval){clearInterval(petalInterval);petalInterval=null;}if(l)l.innerHTML='';
  };
  
  const petalFlyLayer=document.getElementById('petalFlyLayer');
  const heartLayer=document.getElementById('heartLayer');
  const flashLayer=document.getElementById('flashLayer');
  const ketbaiBg = document.getElementById('ketbaiBg');
  
  const playFlyPetalsEffect=(cb)=>{
    petalFlyLayer.innerHTML='';petalFlyLayer.classList.add('active');
    const cols=14, rows=10;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const p=document.createElement('div');p.classList.add('petal-fly');
        const s=Math.random()*6+6; 
        p.style.width=`${s}vw`;p.style.height=`${s}vw`;
        p.style.left=`${(c/cols)*100 + (Math.random()*8-4)}%`;
        p.style.top=`${(r/rows)*100 + (Math.random()*8-4)}%`;
        p.style.animationDelay=`${Math.random()*3}s`;
        petalFlyLayer.appendChild(p);
      }
    }
    setTimeout(()=>{
        petalFlyLayer.classList.remove('active');petalFlyLayer.innerHTML='';
        if(cb)cb();
    },6000); 
  };

  const playHeartEffect=(cb)=>{
    heartLayer.innerHTML=''; heartLayer.classList.add('active');
    const heart = document.createElement('div');
    heart.classList.add('main-heart');
    heart.innerText = '❤️';
    heartLayer.appendChild(heart);

    setTimeout(() => {
        for(let i=0; i<60; i++){
            const spark = document.createElement('div');
            spark.classList.add('spark-particle');
            const angle = (i * 6) * (Math.PI / 180) + (Math.random() * 0.5);
            const distance = Math.random() * 400 + 150;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            spark.style.setProperty('--x', `${x}px`);
            spark.style.setProperty('--y', `${y}px`);
            spark.style.animationDelay = `${Math.random() * 0.2}s`;
            heartLayer.appendChild(spark);
        }
        
        if(cb) cb();

        setTimeout(() => {
            heartLayer.classList.remove('active');
            heartLayer.innerHTML='';
        }, 2000);

    }, 1500);
  };

  const playFlashEffect=(cb)=>{
    flashLayer.innerHTML=''; flashLayer.classList.add('active');
    const circle = document.createElement('div');
    circle.classList.add('flash-circle');
    flashLayer.appendChild(circle);
    
    setTimeout(()=>{
        if(cb) cb();
    }, 1200); 
  };

  document.querySelectorAll('.item-img').forEach((img,index)=>{setTimeout(()=>{img.classList.add('show-img');},500+(index*300));});
  startPetals();
  const smokeLayer=document.getElementById('smokeLayer'),smokeOverlay=document.getElementById('smokeOverlay'),cloudLayer=document.getElementById('cloudLayer'),bloomLayer=document.getElementById('bloomLayer'),mainBg=document.getElementById('mainBg'),videoBg=document.getElementById('videoBg'),companyVideoBg=document.getElementById('companyVideoBg'),flowerVideoBg=document.getElementById('flowerVideoBg'),familyVideoBg=document.getElementById('familyVideoBg'),flowerLogoCover=document.getElementById('flowerLogoCover'),eventCoverImg=document.getElementById('eventCoverImg'),leafCover=document.getElementById('leafCover'),companyLeafCover=document.getElementById('companyLeafCover'),mainTitle=document.getElementById('mainTitle'),imagesWrapper=document.getElementById('imagesWrapper'),wishWrapper=document.getElementById('wishWrapper'),nextBtn=document.getElementById('nextBtn'),wishTextContent=document.getElementById('wishTextContent'),coinStage=document.getElementById('coinStage'),coinFullOverlay=document.getElementById('coinFullOverlay');
  let isTransitioned=false,selectedElement=null,currentItemType=null;
  const playVideoSafe=(v)=>{if(!v)return;v.currentTime=0;let p=v.play();if(p!==undefined){p.catch(()=>{});}};
  const config={
    'dulich':{text:'<span>Con chúc mẹ đi Phú Quốc</span><span>thật vui vẻ, mạnh khỏe,</span><span>luôn hạnh phúc và có thật</span><span>nhiều kỷ niệm đẹp.</span>'},
    'thanhcong':{text:'<span>Chúc mẹ luôn thành công</span><span>trong sự nghiệp,</span><span>quản lý HKH ngày càng</span><span>phát triển vững mạnh!</span>'},
    'hoa':{text:'<span>Chúc mẹ luôn xinh đẹp,</span><span>rạng rỡ như những đóa hoa</span><span>và mãi là bông hoa đẹp nhất</span><span>trong lòng gia đình mình.</span>'},
    'family':{text:'<span>Chúc mẹ luôn mạnh khỏe,</span><span>hạnh phúc và mãi mãi</span><span>bình an bên gia đình mình</span><span>mẹ nhé!</span>'}
  };
  const playCoinEffect=(callback)=>{
    coinStage.style.display='block';coinStage.classList.remove('active');coinFullOverlay.style.display='none';coinFullOverlay.classList.remove('rotating');
    requestAnimationFrame(()=>{coinStage.classList.add('active');});
    setTimeout(()=>{
      mainBg.style.opacity='0';mainTitle.style.opacity='0';imagesWrapper.style.opacity='0';
      coinFullOverlay.style.display='block';void coinFullOverlay.offsetWidth;coinFullOverlay.classList.add('rotating');
      setTimeout(()=>{
        coinFullOverlay.style.display='none';coinFullOverlay.classList.remove('rotating');if(callback)callback();
        setTimeout(()=>{coinStage.classList.remove('active');setTimeout(()=>{coinStage.style.display='none';},1500);},50);
      },2000);
    },1500);
  };
  const playCloudEffect=(cb)=>{
    cloudLayer.innerHTML='';cloudLayer.classList.add('active');
    for(let i=0;i<20;i++){
      const b=document.createElement('div');b.classList.add('cloud-blob');b.classList.add(i%2===0?'from-left':'from-right');
      const s=Math.random()*30+115;b.style.width=`${s}%`;b.style.height=`${s}%`;b.style.top=`${Math.random()*60-40}%`;b.style.animationDelay=`${Math.random()*0.8}s`;cloudLayer.appendChild(b);
    }
    setTimeout(()=>{if(cb)cb();},2000);
    setTimeout(()=>{cloudLayer.classList.remove('active');cloudLayer.innerHTML='';},4000);
  };
  const playBloomEffect=(callback)=>{
    bloomLayer.innerHTML='';bloomLayer.classList.add('active');bloomLayer.classList.remove('fade-out');
    const icons=['🌸','🌺','🌻','🌹','🌷','🌼','💐'],cols=24,rows=16;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const item=document.createElement('div');item.classList.add('bloom-item');
        item.classList.add('size-'+(Math.floor(Math.random()*4)+1));
        item.style.left=`${(c/cols)*110-5+(Math.random()*4-2)}%`;item.style.top=`${(r/rows)*115-15+(Math.random()*4-2)}%`;
        item.innerText=icons[Math.floor(Math.random()*icons.length)];item.style.animationDelay=`${Math.random()*1.5}s`;bloomLayer.appendChild(item);
      }
    }
    setTimeout(()=>{bloomLayer.classList.add('fade-out');},3000);
    setTimeout(()=>{bloomLayer.classList.remove('active');bloomLayer.classList.remove('fade-out');bloomLayer.innerHTML='';if(callback)callback();},5000);
  };
  window.selectItem=(element,type)=>{
    if(isTransitioned)return;
    selectedElement=element;currentItemType=type;
    
    // KHÓA NHẠC VÀ TẠM DỪNG KHI VÀO ITEM
    allowMusic = false; 
    bgMusic.pause();

    videoBg.style.display='none';videoBg.pause();companyVideoBg.style.display='none';companyVideoBg.pause();flowerVideoBg.style.display='none';flowerVideoBg.pause();familyVideoBg.style.display='none';familyVideoBg.pause();
    flowerLogoCover.style.display='none';eventCoverImg.style.display='none';eventCoverImg.style.opacity='0';leafCover.style.display='none';companyLeafCover.style.display='none';mainBg.style.opacity='1';
    
    if(type==='thanhcong'){
      playCoinEffect(()=>{
        companyVideoBg.style.display='block';companyVideoBg.style.opacity='1';eventCoverImg.style.display='block';eventCoverImg.style.opacity='1';companyLeafCover.style.display='block';companyLeafCover.style.opacity='1';
        playVideoSafe(companyVideoBg);stopPetals();wishTextContent.innerHTML=config[type].text;mainTitle.style.display='none';imagesWrapper.style.display='none';wishWrapper.classList.add('show');nextBtn.classList.add('show');isTransitioned=true;
      });
    }
    
    if(type==='dulich'){
      smokeLayer.innerHTML='';smokeLayer.classList.add('active');smokeOverlay.classList.add('active');
      for(let i=0;i<15;i++){
        const c=document.createElement('div');c.classList.add('smoke-circle');
        const s=Math.random()*300+250;c.style.width=`${s}px`;c.style.height=`${s}px`;
        const a=Math.random()*Math.PI*2,d=Math.random()*500+100;c.style.setProperty('--x',`${Math.cos(a)*d}px`);c.style.setProperty('--y',`${Math.sin(a)*d}px`);
        c.style.animationDuration=`${Math.random()*1+3}s`;c.style.animationDelay=`${Math.random()*0.3}s`;smokeLayer.appendChild(c);
      }
      setTimeout(()=>{
        mainBg.style.opacity='0';mainBg.style.display='none';mainTitle.style.opacity='0';imagesWrapper.style.opacity='0';
        setTimeout(()=>{mainTitle.style.display='none';imagesWrapper.style.display='none';},500);
        videoBg.style.display='block';videoBg.style.opacity='1';leafCover.style.display='block';leafCover.style.opacity='1';
        playVideoSafe(videoBg);stopPetals();wishTextContent.innerHTML=config[type].text;smokeOverlay.style.display='none';isTransitioned=true;
      },2000);
      setTimeout(()=>{wishWrapper.classList.add('show');nextBtn.classList.add('show');},2500);
      setTimeout(()=>{smokeLayer.classList.remove('active');smokeLayer.innerHTML='';},6000);
    }
    
    if(type==='hoa'){
      stopPetals();
      playBloomEffect(()=>{
        wishTextContent.innerHTML=config[type].text;wishWrapper.classList.add('show');nextBtn.classList.add('show');
      });
      flowerVideoBg.style.display='block';flowerLogoCover.style.display='block';
      setTimeout(()=>{flowerVideoBg.style.opacity='1';flowerLogoCover.style.opacity='1';},50);
      playVideoSafe(flowerVideoBg);
      setTimeout(()=>{mainBg.style.display='none';mainTitle.style.display='none';imagesWrapper.style.display='none';},3000);
      isTransitioned=true;
    }
    
    if(type==='family'){
      stopPetals();
      mainTitle.style.opacity='0';
      imagesWrapper.style.opacity='0';
      
      playHeartEffect(()=>{
          mainTitle.style.display='none';
          imagesWrapper.style.display='none';
          
          familyVideoBg.style.display='block';
          setTimeout(()=>{
              familyVideoBg.style.opacity='1';
          }, 50);
          playVideoSafe(familyVideoBg);
          
          wishTextContent.innerHTML=config[type].text;
          wishWrapper.classList.add('show');
          nextBtn.classList.add('show');
      });
      
      isTransitioned=true;
    }
  };

  const returnToLobby=()=>{
    videoBg.style.display='none';videoBg.pause();companyVideoBg.style.display='none';companyVideoBg.pause();flowerVideoBg.style.display='none';flowerVideoBg.pause();familyVideoBg.style.display='none';familyVideoBg.pause();
    flowerLogoCover.style.display='none';eventCoverImg.style.display='none';eventCoverImg.style.opacity='0';leafCover.style.display='none';leafCover.style.opacity='0';companyLeafCover.style.display='none';companyLeafCover.style.opacity='0';
    smokeLayer.classList.remove('active');smokeLayer.innerHTML='';smokeOverlay.classList.remove('active');smokeOverlay.style.display='none';bloomLayer.classList.remove('active');bloomLayer.classList.remove('fade-out');bloomLayer.innerHTML='';petalFlyLayer.innerHTML='';petalFlyLayer.classList.remove('active');heartLayer.innerHTML='';heartLayer.classList.remove('active');flashLayer.innerHTML='';flashLayer.classList.remove('active');
    
    // MỞ KHÓA NHẠC VÀ PHÁT LẠI TỪ ĐẦU KHI VỀ LOBBY
    allowMusic = true;
    playMusicFromStart();
    
    if (document.querySelectorAll('.item-img').length === 0) {
        ketbaiBg.style.display = 'block';
        setTimeout(() => { ketbaiBg.style.opacity = '1'; }, 50);
        mainTitle.style.display = 'none';
        imagesWrapper.style.display = 'block';
    } else {
        mainBg.style.display='block';mainBg.style.opacity='1';
        mainTitle.style.display='block';mainTitle.style.opacity='1';mainTitle.classList.remove('show');mainTitle.classList.add('returned');
        imagesWrapper.style.display='block';imagesWrapper.style.opacity='1';
        if(selectedElement){selectedElement.remove();selectedElement=null;}
        const imgs=document.querySelectorAll('.item-img');
        if(imgs.length===3){
          imgs[0].style.top='17%';imgs[0].style.left='23%';imgs[0].style.width=imgs[0].getAttribute('data-width');
          imgs[1].style.top='15%';imgs[1].style.left='52%';imgs[1].style.width=imgs[1].getAttribute('data-width');
          imgs[2].style.top='50%';imgs[2].style.left='38%';imgs[2].style.width=imgs[2].getAttribute('data-width');
        }else if(imgs.length===2){
          imgs[0].style.top='30%';imgs[0].style.left='30%';imgs[1].style.top='30%';imgs[1].style.left='55%';
        }else if(imgs.length===1){
          imgs[0].style.top='35%';imgs[0].style.left='42%';
        }
        imgs.forEach(img=>{img.classList.remove('show-img');img.classList.add('returned');img.style.opacity='1';img.style.transform='translateY(0)';});
    }

    wishWrapper.classList.remove('show');nextBtn.classList.remove('show');wishWrapper.style.display='';nextBtn.style.display='';wishWrapper.style.opacity='';nextBtn.style.opacity='';nextBtn.style.pointerEvents='auto';
    startPetals();isTransitioned=false;
  };
  
  nextBtn.addEventListener('click',()=>{
    nextBtn.style.pointerEvents='none';
    if(currentItemType==='thanhcong'){
      coinStage.style.display='block';coinStage.classList.remove('active');coinFullOverlay.style.display='none';coinFullOverlay.classList.remove('rotating');
      setTimeout(()=>{
        coinStage.classList.add('active');
        setTimeout(()=>{
          coinFullOverlay.style.display='block';void coinFullOverlay.offsetWidth;coinFullOverlay.classList.add('rotating');
          companyVideoBg.style.display='none';companyVideoBg.pause();eventCoverImg.style.display='none';wishWrapper.style.display='none';nextBtn.style.display='none';companyLeafCover.style.display='none';
          if(selectedElement){selectedElement.remove();selectedElement=null;}
          
          if (document.querySelectorAll('.item-img').length === 0) {
              mainBg.style.display = 'none';
              mainTitle.style.display = 'none';
              imagesWrapper.style.display = 'block';
              ketbaiBg.style.display = 'block';
              setTimeout(() => { ketbaiBg.style.opacity = '1'; }, 50);
          } else {
              mainBg.style.display='block';mainBg.style.opacity='1';mainTitle.style.display='block';mainTitle.classList.remove('show');mainTitle.classList.add('returned');mainTitle.style.opacity='1';imagesWrapper.style.display='block';imagesWrapper.style.opacity='1';
              const imgs=document.querySelectorAll('.item-img');
              if(imgs.length===3){
                imgs[0].style.top='17%';imgs[0].style.left='23%';imgs[0].style.width=imgs[0].getAttribute('data-width');
                imgs[1].style.top='15%';imgs[1].style.left='52%';imgs[1].style.width=imgs[1].getAttribute('data-width');
                imgs[2].style.top='50%';imgs[2].style.left='38%';imgs[2].style.width=imgs[2].getAttribute('data-width');
              }else if(imgs.length===2){
                imgs[0].style.top='30%';imgs[0].style.left='30%';imgs[1].style.top='30%';imgs[1].style.left='55%';
              }else if(imgs.length===1){
                imgs[0].style.top='35%';imgs[0].style.left='42%';
              }
              imgs.forEach(img=>{img.classList.remove('show-img');img.classList.add('returned');img.style.opacity='1';img.style.transform='translateY(0)';});
          }

          // MỞ KHÓA NHẠC VÀ PHÁT LẠI KHI VỀ LOBBY
          allowMusic = true;
          playMusicFromStart();

          setTimeout(()=>{
            coinFullOverlay.style.display='none';coinFullOverlay.classList.remove('rotating');coinStage.classList.remove('active');
            setTimeout(()=>{
              coinStage.style.display='none';startPetals();wishWrapper.classList.remove('show');nextBtn.classList.remove('show');
              setTimeout(()=>{wishWrapper.style.display='';nextBtn.style.display='';nextBtn.style.pointerEvents='auto';isTransitioned=false;},100);
            },1500);
          },2000);
        },1500);
      },50);
    }else if(currentItemType==='hoa'){
        wishWrapper.style.opacity='0';
        nextBtn.style.opacity='0';
        flowerVideoBg.style.opacity='0'; 
        flowerLogoCover.style.opacity='0'; 
        
        playFlyPetalsEffect(()=>{});
        
        if(selectedElement){selectedElement.remove();selectedElement=null;}
        
        if (document.querySelectorAll('.item-img').length === 0) {
            mainBg.style.display = 'none';
            mainTitle.style.display = 'none';
            imagesWrapper.style.display = 'block';
            ketbaiBg.style.display = 'block';
            setTimeout(() => { ketbaiBg.style.opacity = '1'; }, 50);
        } else {
            mainBg.style.display='block';mainBg.style.opacity='1';
            mainTitle.style.display='block';mainTitle.classList.remove('show');mainTitle.classList.add('returned');mainTitle.style.opacity='1';
            imagesWrapper.style.display='block';imagesWrapper.style.opacity='1';
            const imgs=document.querySelectorAll('.item-img');
            if(imgs.length===3){
              imgs[0].style.top='17%';imgs[0].style.left='23%';imgs[0].style.width=imgs[0].getAttribute('data-width');
              imgs[1].style.top='15%';imgs[1].style.left='52%';imgs[1].style.width=imgs[1].getAttribute('data-width');
              imgs[2].style.top='50%';imgs[2].style.left='38%';imgs[2].style.width=imgs[2].getAttribute('data-width');
            }else if(imgs.length===2){
              imgs[0].style.top='30%';imgs[0].style.left='30%';imgs[1].style.top='30%';imgs[1].style.left='55%';
            }else if(imgs.length===1){
              imgs[0].style.top='35%';imgs[0].style.left='42%';
            }
            imgs.forEach(img=>{img.classList.remove('show-img');img.classList.add('returned');img.style.opacity='1';img.style.transform='translateY(0)';});
        }
        
        wishWrapper.classList.remove('show');nextBtn.classList.remove('show');
        wishWrapper.style.display='none';nextBtn.style.display='none';
        
        startPetals();
        
        // MỞ KHÓA NHẠC VÀ PHÁT LẠI KHI VỀ LOBBY
        allowMusic = true;
        playMusicFromStart();

        setTimeout(() => {
            flowerVideoBg.style.display='none';
            flowerVideoBg.pause();
            flowerLogoCover.style.display='none';
            
            wishWrapper.style.display='';nextBtn.style.display='';wishWrapper.style.opacity='';nextBtn.style.opacity='';nextBtn.style.pointerEvents='auto';
            isTransitioned=false;
        }, 6000);
    }else if(currentItemType==='family'){
        wishWrapper.style.opacity='0';
        nextBtn.style.opacity='0';
        
        playFlashEffect(()=>{
            familyVideoBg.style.display='none';
            familyVideoBg.pause();
            
            if(selectedElement){selectedElement.remove();selectedElement=null;}
            
            if (document.querySelectorAll('.item-img').length === 0) {
                mainBg.style.display = 'none';
                mainTitle.style.display = 'none';
                imagesWrapper.style.display = 'block';
                ketbaiBg.style.display = 'block';
                setTimeout(() => { ketbaiBg.style.opacity = '1'; }, 50);
            } else {
                mainBg.style.display='block';mainBg.style.opacity='1';
                mainTitle.style.display='block';mainTitle.classList.remove('show');mainTitle.classList.add('returned');mainTitle.style.opacity='1';
                imagesWrapper.style.display='block';imagesWrapper.style.opacity='1';
                const imgs=document.querySelectorAll('.item-img');
                if(imgs.length===3){
                  imgs[0].style.top='17%';imgs[0].style.left='23%';imgs[0].style.width=imgs[0].getAttribute('data-width');
                  imgs[1].style.top='15%';imgs[1].style.left='52%';imgs[1].style.width=imgs[1].getAttribute('data-width');
                  imgs[2].style.top='50%';imgs[2].style.left='38%';imgs[2].style.width=imgs[2].getAttribute('data-width');
                }else if(imgs.length===2){
                  imgs[0].style.top='30%';imgs[0].style.left='30%';imgs[1].style.top='30%';imgs[1].style.left='55%';
                }else if(imgs.length===1){
                  imgs[0].style.top='35%';imgs[0].style.left='42%';
                }
                imgs.forEach(img=>{img.classList.remove('show-img');img.classList.add('returned');img.style.opacity='1';img.style.transform='translateY(0)';});
            }

            wishWrapper.classList.remove('show');nextBtn.classList.remove('show');
            wishWrapper.style.display='none';nextBtn.style.display='none';
            startPetals();

            // MỞ KHÓA NHẠC VÀ PHÁT LẠI KHI VỀ LOBBY
            allowMusic = true;
            playMusicFromStart();
            
            setTimeout(() => {
                flashLayer.classList.remove('active');
                wishWrapper.style.display='';nextBtn.style.display='';wishWrapper.style.opacity='';nextBtn.style.opacity='';nextBtn.style.pointerEvents='auto';
                isTransitioned=false;
            }, 3000);
        });
    }else{
      if(currentItemType==='dulich'){playCloudEffect(()=>{returnToLobby();});}
      else{
        videoBg.style.opacity='0';wishWrapper.style.opacity='0';nextBtn.style.opacity='0';leafCover.style.opacity='0';
        setTimeout(()=>{returnToLobby();},1000);
      }
    }
  });
});
</script>
